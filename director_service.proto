// gRPC Director Service Definition.

syntax = "proto3";
package onesimus.director;

// ==========================================================================
// Director gRPC Service
// ==========================================================================

service Director {
  // Server-Identitaet (ohne Anmeldung): Name, Version, Login-Verfahren
  rpc GetServerInfo (ServerInfoRequest) returns (ServerInfo);

  // Login Schritt 1: Server-Nonce anfordern (ohne Anmeldung)
  rpc GetChallenge (ChallengeRequest) returns (ChallengeResponse);

  // Login Schritt 2: Nachweis senden, liefert Session-Token.
  // Alle uebrigen RPCs verlangen den Token im Metadata-Header
  // "x-onesimus-session".
  rpc Login (LoginRequest) returns (LoginResponse);

  // Einzelnen Befehl ausfuehren
  rpc ExecuteCommand (CommandRequest) returns (CommandResponse);

  // Verfuegbare Befehle auflisten
  rpc ListCommands (ListCommandsRequest) returns (ListCommandsResponse);

  // Interaktive Session (bidirektionaler Stream)
  rpc InteractiveSession (stream SessionMessage) returns (stream SessionMessage);
}

// ==========================================================================
// Authentication
//
// Transport is TLS (server certificate, pinned by the client on first use).
// Login is a challenge-response so the password never crosses the wire:
//   key   = lowercase hex MD5 of the console password (as for TLS-PSK)
//   proof = lowercase hex HMAC-SHA256(key, nonce)
// Console "*UserAgent*" (or empty) authenticates with the Director password.
// ==========================================================================

message ServerInfoRequest {}

message ServerInfo {
  string director_name = 1;
  string version = 2;
  string product = 3;          // "odir"
  int32 bnet_port = 4;
}

message ChallengeRequest {
  string console_name = 1;
}

message ChallengeResponse {
  string nonce = 1;            // single use, expires after 60 s
}

message LoginRequest {
  string console_name = 1;
  string nonce = 2;
  string proof = 3;
}

message LoginResponse {
  bool success = 1;
  string session_token = 2;
  string error_message = 3;
  string director_name = 4;
  string version = 5;
}

// ==========================================================================
// Response Format Negotiation
// Allows per-request override of output format, orthogonal to input protocol.
// ==========================================================================

enum ResponseFormat {
  RESPONSE_FORMAT_DEFAULT = 0;  // Auto-detect from input protocol
  RESPONSE_FORMAT_TEXT = 1;     // Human-readable text (API_MODE_OFF)
  RESPONSE_FORMAT_API = 2;      // Structured text (API_MODE_ON)
  RESPONSE_FORMAT_JSON = 3;     // JSON output (API_MODE_JSON)
  RESPONSE_FORMAT_GRPC = 4;     // Protobuf-serialized (API_MODE_GRPC)
}

// ==========================================================================
// Command Request/Response
// ==========================================================================

message CommandArgument {
  string key = 1;
  oneof value {
    string string_value = 2;
    bytes json_value = 3;
  }
}

message CommandRequest {
  string command_name = 1;
  repeated CommandArgument arguments = 2;
  string session_id = 3;
  ResponseFormat response_format = 4;
}

message CommandResponse {
  bool success = 1;
  string text_output = 2;
  bytes json_output = 3;
  string error_message = 4;
}

// ==========================================================================
// Command Discovery
// ==========================================================================

message ListCommandsRequest {}

message CommandInfo {
  string name = 1;
  string help = 2;
  string usage = 3;
  bool allowed_in_runscript = 4;
  bool audit_event = 5;
}

message ListCommandsResponse {
  repeated CommandInfo commands = 1;
}

// ==========================================================================
// Push Events (MessageBus -> gRPC Stream)
//
// Delivered via InteractiveSession as server-initiated messages.
// Maps 1:1 to directordaemon::message_bus::BusMessage variants.
// gRPC/HTTP2 keeps the connection persistent; the bidi-stream stays
// open for the session lifetime, enabling real-time push notifications.
// ==========================================================================

message ConsoleTextEvent {
  string text = 1;
}

message FdConnectedEvent {
  string client_name = 1;
  int32 protocol_version = 2;
  int64 connect_time = 3;  // unix timestamp
}

message FdDisconnectedEvent {
  string client_name = 1;
}

message FdStatusEvent {
  string client_name = 1;
  bool alive = 2;
  int64 check_time = 3;    // unix timestamp
}

message SdConnectedEvent {
  uint32 job_id = 1;
  string storage_name = 2;
  int64 connect_time = 3;  // unix timestamp
}

message SdDisconnectedEvent {
  uint32 job_id = 1;
  string storage_name = 2;
}

message SdStatusEvent {
  uint32 job_id = 1;
  string storage_name = 2;
  bool alive = 3;
  int64 check_time = 4;    // unix timestamp
}

message JobStatusEvent {
  uint32 job_id = 1;
  string job_name = 2;
  string status = 3;       // e.g. "Running", "OK", "Error", "Canceled"
  int64 timestamp = 4;     // unix timestamp
}

// Wrapper for all push events (server -> client via InteractiveSession)
message PushEvent {
  oneof event {
    ConsoleTextEvent console_text = 1;
    FdConnectedEvent fd_connected = 2;
    FdDisconnectedEvent fd_disconnected = 3;
    FdStatusEvent fd_status = 4;
    SdConnectedEvent sd_connected = 5;
    SdDisconnectedEvent sd_disconnected = 6;
    SdStatusEvent sd_status = 7;
    JobStatusEvent job_status = 8;
  }
}

// ==========================================================================
// Interactive Session (bidirectional streaming)
//
// Client -> Server: COMMAND, INPUT, SIGNAL
// Server -> Client: RESPONSE, PROMPT, PUSH_EVENT
// Every connected client automatically receives push events from the
// MessageBus (FD/SD status, job events, console text) via the bidi-stream.
// ==========================================================================

message SessionMessage {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    COMMAND = 1;
    RESPONSE = 2;
    PROMPT = 3;
    INPUT = 4;
    SIGNAL = 5;
    PUSH_EVENT = 6;       // Server-initiated push from MessageBus
  }

  Type type = 1;
  string session_id = 2;
  CommandRequest command = 3;
  CommandResponse response = 4;
  string prompt_text = 5;
  string input_text = 6;
  string signal_name = 7;
  PushEvent push_event = 8;  // Populated when type == PUSH_EVENT
}
